<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 极速下载器</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: sans-serif; }
        .card-box { background-color: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; width: 100%; max-width: 500px; text-align: center; }
        input { background-color: #020617 !important; border: 1px solid #475569 !important; color: #ffffff !important; padding: 12px !important; border-radius: 8px !important; margin-bottom: 15px; }
        input:focus { border-color: #ef4444 !important; box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.25) !important; }
        .btn-mp4 { background-color: #dc3545; color: white; font-weight: bold; padding: 12px; border-radius: 8px; border: none; width: 48%; }
        .btn-mp3 { background-color: #ffc107; color: #020617; font-weight: bold; padding: 12px; border-radius: 8px; border: none; width: 48%; }
    </style>
</head>
<body>

    <div class="card-box">
        <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 10px; color: #ef4444;">YouTube Downloader</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">输入 YouTube 链接，快速解析 MP4 视频与 MP3 音频</p>
        
        <input type="text" id="videoUrl" class="form-control" placeholder="请粘贴 YouTube 视频链接...">
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <button onclick="convert('mp4')" class="btn btn-mp4">转换 MP4 视频</button>
            <button onclick="convert('mp3')" class="btn btn-mp3">转换 MP3 音频</button>
        </div>
        
        <p style="font-size: 11px; color: #64748b; margin-top: 15px;">提示：点击上方按钮后将自动为您调起安全下载通道。</p>
    </div>

    <script>
        function convert(format) {
            var urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) {
                alert('请先输入有效的 YouTube 链接！');
                return;
            }

            // 提取视频 ID
            var videoId = '';
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = urlInput.match(regExp);
            
            if (match && match[2].length == 11) {
                videoId = match[2];
            } else {
                alert('链接格式不正确，请确保是正确的 YouTube 视频链接！');
                return;
            }

            // 构建绝对稳定的外部直链网关，不再受跨域影响
            var downloadUrl = 'https://yuianian-cloud.loader.to/ulike/' + videoId + '&f=' + format;
            
            // 在手机浏览器中新建一个标签页直接进行安全下载
            window.open(downloadUrl, '_blank');
        }
    </script>
</body>
</html>
